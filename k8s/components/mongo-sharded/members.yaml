# Sharded MongoDB: a three-member config server replica set, two shards
# of three members each, and two mongos routers. Every pod runs the same
# image (docker/mongo-sharded) with a different ROLE; setup is described
# in its entrypoint.sh.
#
# Needs the mongo-keyfile Secret (key: keyfile), which deploy.sh creates.
apiVersion: v1
kind: Service
metadata:
  name: mongo-cfg
  labels:
    app.kubernetes.io/name: mongo-cfg
spec:
  clusterIP: None
  # Members must find each other before they are ready: the first one
  # waits for the others before it creates the replica set.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo-cfg
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-cfg
  labels:
    app.kubernetes.io/name: mongo-cfg
    app.kubernetes.io/component: database
spec:
  serviceName: mongo-cfg
  replicas: 3
  # All members start together; OrderedReady would wait for member 0 to be
  # ready, and member 0 waits for the others.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-cfg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-cfg
        app.kubernetes.io/component: database
        tableflow.io/mongo-cluster: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # Makes the keyfile Secret and the data volume readable by mongodb.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: keyfile
          secret:
            secretName: mongo-keyfile
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
      containers:
        - name: mongod
          image: tableflow-mongo-sharded
          env:
            - name: ROLE
              value: configsvr
            - name: RS_NAME
              value: cfg
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RS_HOST
              value: $(POD_NAME).mongo-cfg
            - name: RS_MEMBERS
              value: "mongo-cfg-0.mongo-cfg:27017 mongo-cfg-1.mongo-cfg:27017 mongo-cfg-2.mongo-cfg:27017"
            - name: MONGOD_EXTRA_ARGS
              value: --wiredTigerCacheSizeGB 0.25
          ports:
            - name: mongo
              containerPort: 27017
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  test -f /tmp/ready && HOME=/tmp mongosh --quiet --eval
                  'quit(db.hello().isWritablePrimary || db.hello().secondary ? 0 : 1)'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "HOME=/tmp mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data/configdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongo-cfg
spec:
  # Two of three members keep a majority, so the set keeps a primary.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-cfg
---
