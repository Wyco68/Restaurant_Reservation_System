# The router the API connects to (MONGO_HOST=mongos). Stateless, so a
# Deployment; each replica runs the idempotent cluster setup on start.
apiVersion: v1
kind: Service
metadata:
  name: mongos
  labels:
    app.kubernetes.io/name: mongos
spec:
  selector:
    app.kubernetes.io/name: mongos
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos
  labels:
    app.kubernetes.io/name: mongos
    app.kubernetes.io/component: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mongos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongos
        app.kubernetes.io/component: database
        tableflow.io/mongo-cluster: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongos
          image: tableflow-mongo-sharded
          env:
            - name: ROLE
              value: mongos
            - name: CONFIG_DB
              value: cfg/mongo-cfg-0.mongo-cfg:27017,mongo-cfg-1.mongo-cfg:27017,mongo-cfg-2.mongo-cfg:27017
            # One seed host per shard is enough; mongos finds the rest.
            - name: SHARDS
              value: shard_a/mongo-shard-a-0.mongo-shard-a:27017 shard_b/mongo-shard-b-0.mongo-shard-b:27017
            - name: MONGO_USER
              valueFrom:
                configMapKeyRef:
                  name: tableflow-config
                  key: MONGO_USER
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: tableflow-config
                  key: MONGO_DB
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tableflow-secrets
                  key: MONGO_PASSWORD
          ports:
            - name: mongo
              containerPort: 27017
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/ready && HOME=/tmp mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "HOME=/tmp mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"]
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keyfile
          secret:
            secretName: mongo-keyfile
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongos
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongos
---
# Members talk to each other (replication, chunk migration) and mongos
# talks to all of them. The API only reaches mongos (base policy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-cluster-internal
spec:
  podSelector:
    matchLabels:
      tableflow.io/mongo-cluster: "true"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tableflow.io/mongo-cluster: "true"
      ports:
        - port: 27017
