# TableFlow: local databases for development, and the whole stack.
#
#   docker compose up -d                    databases and Redis (run the API with uvicorn)
#   docker compose --profile app up -d      + migrations, API and web on :8080
#   ... --profile app --profile monitoring  + Prometheus :9090 and Grafana :3000
#   --profile sharded                       + sharded MongoDB, mongos on :27018
#                                             (API_MONGO_HOST=mongos points the API at it)
#
# There are no passwords in this file. They come from .env, which is not in
# git. Copy .env.example to .env and change the passwords before running,
# or run scripts/make_env.sh to generate them.

# Settings shared by every container that runs the API image. Hosts and
# ports are the in-network ones, not the ones published on the host.
x-api-env: &api-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres_db
  POSTGRES_PORT: "5432"
  MONGO_DB: ${MONGO_DB}
  MONGO_USER: ${MONGO_USER}
  MONGO_PASSWORD: ${MONGO_PASSWORD}
  MONGO_HOST: ${API_MONGO_HOST:-mongo_db}
  MONGO_PORT: "27017"
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  # The image runs head (0004), which only supports new_only.
  NAME_MIGRATION_PHASE: new_only
  # Only nginx reaches the API on this network, so its X-Forwarded-For is
  # trusted for the client address.
  FORWARDED_ALLOW_IPS: "*"

x-api-image: &api-image
  image: ${API_IMAGE:-tableflow-api:local}
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-dev}

# Every member of the sharded MongoDB cluster runs the same image with a
# different ROLE (docker/mongo-sharded/entrypoint.sh).
x-mongo-member: &mongo-member
  image: ${MONGO_SHARDED_IMAGE:-tableflow-mongo-sharded:local}
  build:
    context: .
    dockerfile: docker/mongo-sharded/Dockerfile
  profiles: ["sharded"]
  depends_on:
    mongo_keyfile:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ready && mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  restart: unless-stopped
  networks:
    - tableflow_net

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: tableflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Standard PostgreSQL port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Data survives `docker compose down`.
      - postgres_data:/var/lib/postgresql/data
      # Setup scripts. They run once, in alphabetical order, when the
      # volume is first created.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tableflow_net

  mongo_db:
    image: mongo:6.0
    container_name: tableflow_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      # Standard MongoDB port.
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      # Data survives `docker compose down`.
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tableflow_net

  # Sharded MongoDB (profile: sharded): one config server, two shards and a
  # mongos router. Each is a one-member replica set to keep it laptop-sized;
  # production runs three members per set (k8s/components/mongo-sharded).

  # One-shot: the shared keyfile members authenticate to each other with.
  # Generated on first start into a volume, never stored in git.
  mongo_keyfile:
    image: ${MONGO_SHARDED_IMAGE:-tableflow-mongo-sharded:local}
    build:
      context: .
      dockerfile: docker/mongo-sharded/Dockerfile
    profiles: ["sharded"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "[ -s /keys/keyfile ] || head -c 756 /dev/urandom | base64 -w0 > /keys/keyfile;
         chown 999:999 /keys/keyfile && chmod 400 /keys/keyfile"
    volumes:
      - mongo_keyfile:/keys
    restart: "no"

  mongo_cfg:
    <<: *mongo-member
    environment:
      ROLE: configsvr
      RS_NAME: cfg
      RS_HOST: mongo_cfg
    volumes:
      - mongo_keyfile:/etc/mongo-keyfile:ro
      - mongo_cfg_data:/data/configdb

  mongo_shard_a:
    <<: *mongo-member
    environment:
      ROLE: shardsvr
      RS_NAME: shard_a
      RS_HOST: mongo_shard_a
    volumes:
      - mongo_keyfile:/etc/mongo-keyfile:ro
      - mongo_shard_a_data:/data/db

  mongo_shard_b:
    <<: *mongo-member
    environment:
      ROLE: shardsvr
      RS_NAME: shard_b
      RS_HOST: mongo_shard_b
    volumes:
      - mongo_keyfile:/etc/mongo-keyfile:ro
      - mongo_shard_b_data:/data/db

  mongos:
    <<: *mongo-member
    environment:
      ROLE: mongos
      CONFIG_DB: cfg/mongo_cfg:27017
      SHARDS: shard_a/mongo_shard_a:27017 shard_b/mongo_shard_b:27017
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
    volumes:
      - mongo_keyfile:/etc/mongo-keyfile:ro
    ports:
      - "${MONGOS_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      mongo_cfg:
        condition: service_healthy
      mongo_shard_a:
        condition: service_healthy
      mongo_shard_b:
        condition: service_healthy

  # Response cache. Holds nothing that cannot be rebuilt, so no volume and
  # no persistence; LRU eviction caps its memory.
  redis:
    image: redis:7.4-alpine
    container_name: tableflow_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only: there is no password on the dev cache.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tableflow_net

  # One-shot: brings the schema to head, then exits. The API waits for it.
  migrate:
    <<: *api-image
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"
    networks:
      - tableflow_net

  api:
    <<: *api-image
    profiles: ["app"]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo_db:
        condition: service_healthy
      # Started, not healthy: the API runs without its cache.
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - tableflow_net

  web:
    image: ${WEB_IMAGE:-tableflow-web:local}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    profiles: ["app"]
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tableflow_net

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    networks:
      - tableflow_net

  # Dashboards are provisioned from files, so viewing needs no login.
  # Signing in as admin (to edit) asks for a new password the first time.
  grafana:
    image: grafana/grafana-oss:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tableflow.json
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tableflow_net

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  mongo_keyfile:
  mongo_cfg_data:
  mongo_shard_a_data:
  mongo_shard_b_data:

networks:
  tableflow_net:
    driver: bridge
