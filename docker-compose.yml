# TableFlow: local databases for development, and the whole stack.
#
#   docker compose up -d                    databases and Redis (run the API with uvicorn)
#   docker compose --profile app up -d      + migrations, API and web on :8080
#
# There are no passwords in this file. They come from .env, which is not in
# git. Copy .env.example to .env and change the passwords before running,
# or run scripts/make_env.sh to generate them.

# Settings shared by every container that runs the API image. Hosts and
# ports are the in-network ones, not the ones published on the host.
x-api-env: &api-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres_db
  POSTGRES_PORT: "5432"
  MONGO_DB: ${MONGO_DB}
  MONGO_USER: ${MONGO_USER}
  MONGO_PASSWORD: ${MONGO_PASSWORD}
  MONGO_HOST: ${API_MONGO_HOST:-mongo_db}
  MONGO_PORT: "27017"
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # The image runs head (0004), which only supports new_only.
  NAME_MIGRATION_PHASE: new_only
  # Only nginx reaches the API on this network, so its X-Forwarded-For is
  # trusted for the client address.
  FORWARDED_ALLOW_IPS: "*"

x-api-image: &api-image
  image: ${API_IMAGE:-tableflow-api:local}
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-dev}

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: tableflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Standard PostgreSQL port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Data survives `docker compose down`.
      - postgres_data:/var/lib/postgresql/data
      # Setup scripts. They run once, in alphabetical order, when the
      # volume is first created.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tableflow_net

  mongo_db:
    image: mongo:6.0
    container_name: tableflow_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      # Standard MongoDB port.
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      # Data survives `docker compose down`.
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tableflow_net

  # Response cache. Holds nothing that cannot be rebuilt, so no volume and
  # no persistence; LRU eviction caps its memory.
  redis:
    image: redis:7.4-alpine
    container_name: tableflow_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only: there is no password on the dev cache.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tableflow_net

  # One-shot: brings the schema to head, then exits. The API waits for it.
  migrate:
    <<: *api-image
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"
    networks:
      - tableflow_net

  api:
    <<: *api-image
    profiles: ["app"]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo_db:
        condition: service_healthy
      # Started, not healthy: the API runs without its cache.
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - tableflow_net

  web:
    image: ${WEB_IMAGE:-tableflow-web:local}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    profiles: ["app"]
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tableflow_net

volumes:
  postgres_data:
  mongo_data:

networks:
  tableflow_net:
    driver: bridge
