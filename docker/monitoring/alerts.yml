# Alert rules. The thresholds are the CP3 load-test targets
# (docs/PERFORMANCE.md): errors under 1%, p95 under 200 ms.
groups:
  - name: tableflow-api
    rules:
      - alert: TableflowApiDown
        expr: up{job="tableflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API target {{ $labels.instance }} is not answering scrapes"

      - alert: TableflowHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 1% of API requests fail with 5xx"

      - alert: TableflowSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/metrics|/health.*"}[5m]))
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 200 ms for 10 minutes"

      - alert: TableflowCacheBypassed
        expr: sum(rate(tableflow_cache_lookups_total{result="bypass"}[5m])) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Redis is unreachable; catalogue reads go to the databases"
