<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TableFlow — restaurant booking</title>
  <meta name="description" content="Find a restaurant, browse the menu and reserve a table.">
  <!-- The header's utensils mark, inline so there is no favicon file to serve. -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display+SC:wght@400;700&display=swap">
  <link rel="stylesheet" href="./src/style.css">

  <!-- No build step: the browser resolves bare imports through this map.

    {
      "imports": {
        "vue": "./vendor/vue.esm-browser.prod.js",
        "vue-router": "./vendor/vue-router.esm-browser.prod.js"
      }
    }
